<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>深圳社保 · 公积金网点通</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E6857'/%3E%3Cpath d='M20 34l8 8 16-18' stroke='%23fff' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ===== 设计令牌 ===== */
:root{
  --bg:#E9ECE6;
  --surface:#FFFFFF;
  --ink:#13221D;
  --muted:#66756F;
  --faint:#98A39D;
  --line:#E1E5DF;
  --sb:#0E6857;        /* 社保：深青绿 */
  --sb-soft:#E2EFEA;
  --gjj:#1B4F72;       /* 公积金：政务蓝 */
  --gjj-soft:#E3EAF1;
  --accent:#B2762A;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",sans-serif;
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
/* ===== 舞台 ===== */
.stage{
  min-height:100vh;
  display:flex;align-items:flex-start;justify-content:center;
  gap:56px;padding:48px 32px;
  max-width:1180px;margin:0 auto;
}
.intro{width:300px;flex:0 0 300px;padding-top:12px}
.intro .eyebrow{
  font-size:12px;letter-spacing:.24em;color:var(--muted);
  border-bottom:1px solid var(--line);padding-bottom:10px;
}
.intro h1{
  font-size:30px;line-height:1.28;margin:22px 0 14px;font-weight:700;letter-spacing:-.01em;
}
.intro h1 em{font-style:normal;display:block;font-size:17px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:8px}
.intro p{font-size:13.5px;line-height:1.8;color:var(--muted);margin:0 0 22px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.stats div{background:var(--surface);padding:12px 10px 11px;text-align:center}
.stats b{display:block;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats span{font-size:11px;color:var(--muted);display:block;margin-top:5px}
.stats div:nth-child(1) b{color:var(--sb)}
.stats div:nth-child(2) b{color:var(--gjj)}
.stats div:nth-child(3) b{color:var(--accent)}
.legend{font-size:12px;color:var(--muted);line-height:1.9}
.legend li{list-style:none;padding-left:0;margin-bottom:2px}
.legend li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px;vertical-align:1px;background:var(--sb)}
.legend li:nth-child(2)::before{background:var(--gjj)}
.legend li:nth-child(3)::before{background:var(--accent)}
/* ===== 手机框 ===== */
.phone{
  width:414px;flex:0 0 414px;
  height:min(880px,calc(100vh - 96px));
  background:var(--surface);
  border:1px solid #D6DBD5;border-radius:26px;
  box-shadow:0 24px 48px -24px rgba(19,34,29,.34),0 1px 0 #fff inset;
  overflow:hidden;display:flex;flex-direction:column;position:relative;
}
/* ===== 顶栏 ===== */
.topbar{
  flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);
  padding:14px 16px 0;position:relative;z-index:2;
}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.brandrow h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
.brandrow h2 i{font-style:normal;color:var(--sb)}
.brandrow h2 s{text-decoration:none;color:var(--gjj)}
.brandrow .date{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.searchbox{
  display:flex;align-items:center;gap:9px;
  background:#F1F3EF;border:1px solid #E4E8E2;border-radius:11px;
  padding:0 12px;height:42px;margin-bottom:12px;
}
.searchbox svg{width:16px;height:16px;flex:0 0 16px;stroke:#7E8B85}
.searchbox input{
  flex:1;border:0;background:none;outline:none;font-size:14px;color:var(--ink);font-family:inherit;
  min-width:0;
}
.searchbox input::placeholder{color:#9BA6A0}
.searchbox .clr{
  display:none;border:0;background:#D8DED9;color:#43514C;border-radius:50%;
  width:18px;height:18px;font-size:12px;line-height:1;cursor:pointer;flex:0 0 18px;
  font-family:inherit;
}
.searchbox .clr.on{display:block}
/* ===== 筛选 ===== */
.filters{padding-bottom:10px}
.frow{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.flabel{
  flex:0 0 30px;font-size:11.5px;color:var(--faint);padding-top:7px;letter-spacing:.04em;
}
.chips{display:flex;gap:7px;flex-wrap:wrap;flex:1;min-width:0}
.chip{
  border:1px solid var(--line);background:#FAFBF9;color:#43514C;
  font-size:12.5px;padding:5px 11px;border-radius:999px;cursor:pointer;
  font-family:inherit;line-height:1.4;transition:background .12s,color .12s,border-color .12s;
}
.chip:hover{border-color:#C9D1CB;background:#F2F4F1}
.chip.on{background:var(--sb);border-color:var(--sb);color:#fff}
.chip.on[data-org="公积金"]{background:var(--gjj);border-color:var(--gjj)}
.summary{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);
  background:#FAFBF8;
}
.summary .cnt b{color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
/* ===== 列表 ===== */
.list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 0 0;scrollbar-width:thin}
.item{
  padding:15px 16px 14px;border-bottom:1px solid #EDF0EB;cursor:pointer;
  transition:background .12s;position:relative;
}
.item:hover{background:#F8FAF7}
.item .row1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tag{
  font-size:10.5px;line-height:1;padding:4px 6px 4px;border-radius:4px;font-weight:600;letter-spacing:.02em;
}
.tag.sb{background:var(--sb-soft);color:var(--sb)}
.tag.gjj{background:var(--gjj-soft);color:var(--gjj)}
.item .nm{font-size:15.5px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tp{font-size:11px;color:var(--faint);flex:0 0 auto}
.item .ad{font-size:12.5px;color:#4E5C57;line-height:1.55;margin-bottom:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .meta{display:flex;align-items:center;gap:14px}
.item .tel{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.item .acts{margin-left:auto;display:flex;gap:7px}
.mini{
  border:1px solid var(--line);background:#fff;color:#37443F;font-size:11.5px;
  padding:4px 9px;border-radius:7px;cursor:pointer;font-family:inherit;line-height:1.5;
  display:inline-flex;align-items:center;gap:4px;
}
.mini:hover{border-color:#C4CDC6;background:#F6F8F4}
.mini.pri{border-color:#CBD9D3;background:var(--sb-soft);color:var(--sb)}
/* ===== 空态 ===== */
.empty{
  position:absolute;inset:0;padding:0 32px;text-align:center;color:var(--muted);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  background:var(--surface);z-index:1;
}
.empty.on{display:flex}
.empty .t{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:6px}
.empty p{font-size:13px;margin:0 0 18px}
/* ===== 详情 ===== */
.detail{position:absolute;inset:0;overflow-y:auto;display:none;padding-bottom:88px;background:var(--surface);z-index:5}
.detail.on{display:block}
.listwrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.backbar{
  display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);z-index:3;
}
.backbar button{
  border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:5px;
  font-family:inherit;font-size:13px;color:var(--muted);
}
.backbar button:hover{color:var(--ink)}
.dhead{padding:20px 20px 18px;border-bottom:8px solid #F4F6F2}
.dhead .row1{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dhead .tp{font-size:11px;color:var(--faint)}
.dhead h3{margin:0 0 8px;font-size:21px;line-height:1.35;letter-spacing:-.02em}
.dhead .dk{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.dk span{font-size:11px;padding:3px 8px;border-radius:5px;background:#F0F3EF;color:#4E5C57}
.dbody{padding:4px 20px 20px}
.field{padding:15px 0;border-bottom:1px solid #F0F2EE}
.field:last-child{border-bottom:0}
.field .k{font-size:11.5px;color:var(--faint);letter-spacing:.06em;margin-bottom:6px}
.field .v{font-size:14px;line-height:1.65;color:var(--ink)}
.field .v.tel{font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;letter-spacing:.01em}
.field .n{font-size:12px;color:var(--muted);line-height:1.7;margin-top:4px}
.actionbar{
  position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.97);border-top:1px solid var(--line);backdrop-filter:blur(8px);
  transform:translateY(110%);transition:transform .22s cubic-bezier(.3,.9,.4,1);z-index:6;
}
.actionbar.on{transform:translateY(0)}
.act{
  flex:1;height:46px;border-radius:11px;border:1px solid var(--line);background:#F6F8F4;
  color:#2C3A35;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.act:hover{background:#EEF2ED}
.act.pri{background:var(--sb);border-color:var(--sb);color:#fff}
.act.pri:hover{background:#0B5748}
/* ===== toast ===== */
.toast{
  position:absolute;left:50%;bottom:96px;transform:translate(-50%,12px);
  background:rgba(19,34,29,.9);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:9px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:9;white-space:nowrap;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ===== 页脚注 ===== */
.footnote{
  padding:14px 16px 26px;font-size:11px;line-height:1.8;color:var(--faint);
  background:#FAFBF8;border-top:1px solid var(--line);
}
/* ===== 响应式 ===== */
@media (max-width:900px){
  .stage{padding:0;gap:0;max-width:none;display:block}
  .intro{display:none}
  .phone{
    width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none;
  }
  .toast{bottom:100px}
  .searchbox input{font-size:16px}
  .item .nm{font-size:16px}
  .item .ad,.item .tel{font-size:13px}
  .summary{font-size:12.5px}
  .chip{min-height:36px;display:inline-flex;align-items:center}
  .mini{min-height:38px;padding:6px 12px}
  .field .v{font-size:15px}
  .footnote{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3l8 18-8-4-8 4z" fill="#fff"/></svg>
        导航
      </button>
    </div>
    <div class="toast" id="toast"></div>
  </div>
</div>

/* ===== 状态 ===== */
var S = { org: '全部', dist: '全部', q: '' };
var cur = null;

/* ===== 工具 ===== */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
var toastTimer = null;
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 1600);
}

/* ===== 初始化筛选 ===== */
var DISTS = ['全部'];
OUTLETS.forEach(function(o){ if (DISTS.indexOf(o.district) < 0) DISTS.push(o.district); });
$('#distChips').innerHTML = DISTS.map(function(d){
  return '<button class="chip' + (d === '全部' ? ' on' : '') + '" data-dist="' + esc(d) + '">' + esc(d) + '</button>';
}).join('');

/* ===== 过滤 ===== */
function filtered(){
  var q = S.q.trim().toLowerCase();
  return OUTLETS.filter(function(o){
    if (S.org !== '全部' && o.org !== S.org) return false;
    if (S.dist !== '全部' && o.district !== S.dist) return false;
    if (!q) return true;
    var hay = (o.name + ' ' + o.address + ' ' + o.district + ' ' + o.type + ' ' + (o.caps || []).join(' ') + ' ' + (o.bank || '')).toLowerCase();
    return hay.indexOf(q) > -1;
  });
}

/* ===== 列表渲染 ===== */
var FOOTNOTE = '<div class="footnote">数据来源：深圳市社会保险基金管理局、深圳市住房和建设局公开网点信息（2026 年 11 月整理），共 ' + OUTLETS.length + ' 个网点。办理前建议先电话确认当日窗口安排。</div>';
function renderList(){
  var arr = filtered();
  $('#cnt').textContent = arr.length;
  $('#hint').textContent = (S.org === '全部' ? '全部机构' : S.org) + (S.dist === '全部' ? ' · 全市' : ' · ' + S.dist);
  $('#empty').classList.toggle('on', arr.length === 0);
  $('#list').innerHTML = arr.map(function(o){
    var orgCls = o.org === '社保' ? 'sb' : 'gjj';
    return '<div class="item" data-id="' + o.id + '">' +
      '<div class="row1"><span class="tag ' + orgCls + '">' + (o.org === '社保' ? '社保' : '公积金') + '</span>' +
      '<span class="nm">' + esc(o.name) + '</span>' +
      '<span class="tp">' + esc(o.type) + '</span></div>' +
      '<div class="ad">' + esc(o.address) + '</div>' +
      '<div class="meta"><span class="tel">' + esc(o.phone) + '</span>' +
      '<div class="acts">' +
      '<button class="mini" data-act="tel" data-id="' + o.id + '">电话</button>' +
      '<button class="mini pri" data-act="nav" data-id="' + o.id + '">导航</button>' +
      '</div></div></div>';
  }).join('') + FOOTNOTE;
}

/* ===== 详情渲染 ===== */
function findById(id){
  for (var i = 0; i < OUTLETS.length; i++) if (OUTLETS[i].id === id) return OUTLETS[i];
  return null;
}
function renderDetail(o){
  if (!o) { location.hash = '#/'; return; }
  cur = o;
  var orgCls = o.org === '社保' ? 'sb' : 'gjj';
  $('#detail').innerHTML =
    '<div class="backbar"><button id="back">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M14 5l-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>返回列表</button>' +
    '</div>' +
    '<div class="dhead"><div class="row1"><span class="tag ' + orgCls + '">' + (o.org === '社保' ? '社保' : '公积金') + '</span>' +
      '<span class="tp">' + esc(o.type) + ' · ' + esc(o.district) + '</span></div>' +
      '<h3>' + esc(o.name) + '</h3>' +
      '<div class="dk">' + (o.caps || []).map(function(c){ return '<span>' + esc(c) + '</span>'; }).join('') + '</div>' +
    '</div>' +
    '<div class="dbody">' +
      field('地址', esc(o.address)) +
      field(o.type === '社银合作网点' ? '电话（银行客服）' : '咨询电话', '<span class="v tel">' + esc(o.phone) + '</span>') +
      field('办理时间', o.hours ? esc(o.hours) : '未公布，建议先致电确认') +
      (o.note ? field('说明', esc(o.note)) : '') +
      field('数据来源', '<span style="font-size:12.5px;color:#66756F">' + esc(o.source) + '</span>') +
    '</div>';
  $('#detail').classList.add('on');
  $('#detail').scrollTop = 0;
  $('#actbar').classList.add('on');
  $('#back').onclick = function(){ location.hash = '#/'; };
}
function field(k, v){
  return '<div class="field"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
}

/* ===== 路由 ===== */
function route(){
  var h = location.hash || '#/';
  if (h.indexOf('#/o/') === 0) {
    $('.listwrap').style.display = 'none';
    $('#detail').classList.add('on');
    renderDetail(findById(h.slice(4)));
  } else {
    $('.listwrap').style.display = 'flex';
    $('#detail').classList.remove('on');
    $('#actbar').classList.remove('on');
    cur = null;
  }
}
window.addEventListener('hashchange', route);

/* ===== 交互 ===== */
$('#q').addEventListener('input', function(e){
  S.q = e.target.value; $('#clr').classList.toggle('on', !!S.q); renderList();
});
$('#clr').addEventListener('click', function(){
  $('#q').value = ''; S.q = ''; $('#clr').classList.remove('on'); renderList(); $('#q').focus();
});
$('#orgChips').addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if (!b) return;
  S.org = b.dataset.org;
  Array.prototype.forEach.call(this.querySelectorAll('.chip'), function(c){ c.classList.remove('on'); });
  b.classList.add('on'); renderList();
});
$('#distChips').addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if (!b) return;
  S.dist = b.dataset.dist;
  Array.prototype.forEach.call(this.querySelectorAll('.chip'), function(c){ c.classList.remove('on'); });
  b.classList.add('on'); renderList();
});
$('#list').addEventListener('click', function(e){
  var btn = e.target.closest('button[data-act]');
  if (btn) {
    e.stopPropagation();
    var o = findById(btn.dataset.id);
    if (btn.dataset.act === 'tel') doTel(o); else doNav(o);
    return;
  }
  var it = e.target.closest('.item');
  if (it) location.hash = '#/o/' + it.dataset.id;
});
$('#reset').addEventListener('click', function(){
  S = { org: '全部', dist: '全部', q: '' };
  $('#q').value = ''; $('#clr').classList.remove('on');
  Array.prototype.forEach.call($('#orgChips').querySelectorAll('.chip'), function(c){ c.classList.toggle('on', c.dataset.org === '全部'); });
  Array.prototype.forEach.call($('#distChips').querySelectorAll('.chip'), function(c){ c.classList.toggle('on', c.dataset.dist === '全部'); });
  renderList();
});

/* ===== 动作 ===== */
function doTel(o){
  navigator.clipboard && navigator.clipboard.writeText(o.phone).catch(function(){});
  toast('已复制号码 ' + o.phone + '，手机上会直接拨号');
}
/* 导航：有坐标直接用坐标定位；没有坐标就用「街道门牌地址」搜索。
   不能用机构名搜索——"福田分局"这类名字高德会匹配到公安分局等错误 POI。 */
function navAddr(o){
  var a = (o.address || '').replace(/（[^）]*）/g, '').replace(/\([^)]*\)/g, '').trim();
  var cut = a.indexOf('、');
  if (cut > 10) a = a.slice(0, cut);
  return a;
}
function doNav(o){
  var url;
  if (o.lat && o.lng) {
    url = 'https://uri.amap.com/marker?position=' + o.lng + ',' + o.lat
        + '&name=' + encodeURIComponent(o.name)
        + '&src=doubao&coordinate=gaode&callnative=1';
  } else {
    var kw = navAddr(o) || ((o.district || '') + (o.name || ''));
    url = 'https://uri.amap.com/search?keyword=' + encodeURIComponent(kw)
        + '&city=' + encodeURIComponent('深圳') + '&callnative=1';
  }
  window.open(url, '_blank');
  toast('已跳到高德地图，可驾车或公交导航');
}
$('#btnTel').addEventListener('click', function(){ if (cur) doTel(cur); });
$('#btnCopy').addEventListener('click', function(){
  if (!cur) return;
  if (navigator.clipboard) navigator.clipboard.writeText(cur.address).then(function(){ toast('地址已复制'); });
  else toast('请长按地址手动复制');
});
$('#btnNav').addEventListener('click', function(){ if (cur) doNav(cur); });

/* ===== 启动 ===== */
function setStats(){
  $('#stSb').textContent = OUTLETS.filter(function(o){ return o.org === '社保'; }).length;
  $('#stGjj').textContent = OUTLETS.filter(function(o){ return o.org === '公积金' && o.type !== '银行网点'; }).length;
  $('#stBank').textContent = OUTLETS.filter(function(o){ return o.type === '银行网点'; }).length;
}
setStats();
renderList();
route();
</script>
</body>
</html>
